          \        code = str(room.get(\"code\") or \"\").strip()\n        title = str(room.get(\"title\") or room.get(\"\
          name\") or \"\").strip()\n        if code == wanted or (wanted and wanted in title):\n            matched = room\n\
          \            break\n\n    if not matched:\n        available_codes = \"、\".join(\n            str(room.get(\"code\"\
          ))\n            for room in rooms\n            if room.get(\"code\") is not None\n        )\n        matched_preview\
          \ = str(rooms[0])[:200] if rooms else \"\"\n        empty_result[\"errorMessage\"] = (\n            f\"实时房态中没有找到房型代码\
          \ {wanted}。\"\n            f\"当前可选：{available_codes}。\"\n            f\"第一条房型示例：{matched_preview}\"\n        )\n\
          \        return empty_result\n\n    rates = _get_rates(matched)\n    matched_preview = str({k: v for k, v in matched.items()\
          \ if k != \"rates\"})[:200]\n    if not rates:\n        empty_result[\"errorMessage\"] = (\n            f\"房型 {wanted}\
          \ 在实时房态中没有 rates/ratePlans 字段。\"\n            f\"房型数据（不含rates）：{matched_preview}\"\n        )\n        return empty_result\n\
          \n    for rate in rates:\n        verify_ids = _extract_verify_ids(rate)\n        rate_code = _extract_rate_code(rate)\n\
          \        if verify_ids and rate_code:\n            return {\n                \"status\": \"ok\",\n             \
