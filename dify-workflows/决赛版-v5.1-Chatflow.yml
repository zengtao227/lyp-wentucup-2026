    - data:
        code: "import json\nimport re\n\ndef _try_json(text):\n    text = str(text or \"\").strip()\n    if not text:\n  \
          \      return None\n    try:\n        return json.loads(text)\n    except Exception:\n        pass\n    decoder\
          \ = json.JSONDecoder()\n    for i, ch in enumerate(text):\n        if ch not in \"{[\":\n            continue\n\
          \        try:\n            val, _ = decoder.raw_decode(text[i:])\n            return val\n        except Exception:\n\
          \            continue\n    return None\n\nORDER_FIELDS = [\n    \"bookingId\", \"orderId\", \"orderNo\", \"order_no\"\
          ,\n    \"referenceNo\", \"reservationId\", \"confirmationNo\",\n]\n\ndef _find_order(obj, depth=0):\n    if depth\
          \ > 6 or obj is None:\n        return \"\"\n    if isinstance(obj, dict):\n        for field in ORDER_FIELDS:\n\
          \            val = obj.get(field)\n            if val is not None:\n                s = str(val).strip()\n     \
          \           if s and s not in (\"0\", \"null\", \"None\", \"false\", \"\"):\n                    return s\n    \
          \    for v in obj.values():\n            r = _find_order(v, depth + 1)\n            if r:\n                return\
          \ r\n    elif isinstance(obj, list):\n        for item in obj:\n            r = _find_order(item, depth + 1)\n \
          \           if r:\n                return r\n    return \"\"\n\ndef _find_error(obj, depth=0):\n    if depth > 4\
          \ or not isinstance(obj, dict):\n        return \"\"\n    code = obj.get(\"errorCode\") or obj.get(\"code\")\n \
          \   msg = obj.get(\"message\") or obj.get(\"msg\") or obj.get(\"errMsg\") or \"\"\n    err = obj.get(\"error\")\n\
          \    if isinstance(code, int) and code not in (0, 200):\n        return f\"错误码 {code}：{msg}\"\n    if isinstance(err,\
          \ str) and err and err.lower() not in (\"false\", \"null\", \"none\", \"\"):\n        return err\n    for v in obj.values():\n\
          \        r = _find_error(v, depth + 1)\n        if r:\n            return r\n    return \"\"\n\nTEXT_ORDER_PATTERNS\
          \ = [\n    r\"订单号[：:]\\s*(\\S+)\",\n    r\"订单编号[：:]\\s*(\\S+)\",\n    r\"预订号[：:]\\s*(\\S+)\",\n    r\"order\\s*no[：:\\\
          s]+(\\S+)\",\n    r\"orderNo[：:\\s]+(\\S+)\",\n    r\"referenceNo[：:\\s]+(\\S+)\",\n    r\"bookingId[：:\\s]+(\\\
          S+)\",\n]\n\ndef _extract_from_text(raw: str) -> str:\n    for pattern in TEXT_ORDER_PATTERNS:\n        m = re.search(pattern,\
          \ raw, re.IGNORECASE)\n        if m:\n            val = m.group(1).strip(\".,，。;；\\\"'\")\n            if val and\
          \ len(val) >= 4:\n                return val\n    return \"\"\n\ndef main(submitResult: str) -> dict:\n    raw =\
          \ str(submitResult or \"\").strip()\n    raw_preview = raw[:300] if len(raw) > 300 else raw\n    if not raw:\n \
          \       return {\n            \"orderNo\": \"\",\n            \"errorMessage\": \"预订接口未返回任何数据，请联系前台确认。电话：0750-662-9888\"\
          ,\n            \"rawResponse\": \"\",\n        }\n\n    # 优先尝试 JSON 解析\n    data = _try_json(raw)\n    if data is\
          \ not None:\n        if isinstance(data, str):\n            order_no = _extract_from_text(data)\n            if\
          \ order_no:\n                return {\"orderNo\": order_no, \"errorMessage\": \"\", \"rawResponse\": raw_preview}\n\
          \            raw = data\n        order_no = _find_order(data)\n        if order_no:\n            return {\"orderNo\"\
          : order_no, \"errorMessage\": \"\", \"rawResponse\": raw_preview}\n        error_msg = _find_error(data)\n     \
          \   if not error_msg:\n            error_msg = \"预订接口未返回订单编号，请联系前台确认。电话：0750-662-9888\"\n        return {\"orderNo\"\
          : \"\", \"errorMessage\": error_msg, \"rawResponse\": raw_preview}\n\n    # JSON 解析失败：尝试从纯文本中用正则提取订单号\n    order_no\
          \ = _extract_from_text(raw)\n    if order_no:\n        return {\"orderNo\": order_no, \"errorMessage\": \"\", \"\
          rawResponse\": raw_preview}\n\n    # 文本含成功关键词但未能提取订单号\n    success_keywords = [\"预订已经成功\", \"预订成功\", \"booking success\"\
          , \"successfully booked\"]\n    if any(kw in raw for kw in success_keywords):\n        return {\n            \"\
          orderNo\": \"\",\n            \"errorMessage\": f\"预订成功但系统未能提取订单编号，请联系前台查询。电话：0750-662-9888。原始返回：{raw_preview}\"\
          ,\n            \"rawResponse\": raw_preview,\n        }\n\n    return {\n        \"orderNo\": \"\",\n        \"\
          errorMessage\": f\"预订接口返回未知格式，请联系前台确认。电话：0750-662-9888\",\n        \"rawResponse\": raw_preview,\n    }\n"
