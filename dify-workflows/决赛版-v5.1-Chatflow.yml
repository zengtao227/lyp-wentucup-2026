    - data:
        code: "import json\nimport re\n\ndef _try_json(text):\n    text = str(text or \"\").strip()\n    if not text:\n  \
          \      return None\n    try:\n        return json.loads(text)\n    except Exception:\n        pass\n    decoder\
          \ = json.JSONDecoder()\n    for index, char in enumerate(text):\n        if char not in \"{[\":\n            continue\n\
          \        try:\n            value, _ = decoder.raw_decode(text[index:])\n            return value\n        except\
          \ Exception:\n            continue\n    return None\n\ndef _find_rooms(value, depth=0):\n    if depth > 8 or value\
          \ is None:\n        return []\n    if isinstance(value, str):\n        parsed = _try_json(value)\n        if parsed\
          \ is None:\n            return []\n        return _find_rooms(parsed, depth + 1)\n    if isinstance(value, dict):\n\
          \        rooms = value.get(\"rooms\")\n        if isinstance(rooms, list):\n            return rooms\n        content\
          \ = value.get(\"content\")\n        if isinstance(content, list):\n            for item in content:\n          \
          \      rooms = _find_rooms(item, depth + 1)\n                if rooms:\n                    return rooms\n     \
          \   text = value.get(\"text\")\n        rooms = _find_rooms(text, depth + 1)\n        if rooms:\n            return\
          \ rooms\n        for item in value.values():\n            rooms = _find_rooms(item, depth + 1)\n            if rooms:\n\
          \                return rooms\n    if isinstance(value, list):\n        for item in value:\n            rooms =\
          \ _find_rooms(item, depth + 1)\n            if rooms:\n                return rooms\n    return []\n\ndef _to_iso_date(date_str:\
          \ str) -> str:\n    date_str = str(date_str or \"\").strip()\n    if not date_str:\n        return \"\"\n    m =\
          \ re.search(r\"(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})\", date_str)\n    if not m:\n        return \"\"\n    year =\
          \ m.group(1)\n    month = int(m.group(2))\n    day = int(m.group(3))\n    return f\"{year}-{month:02d}-{day:02d}T00:00:00.000+08:00\"\
          \n\nRATE_FIELDS = [\"rates\", \"ratePlans\", \"plans\", \"pricePlans\", \"rate_plans\", \"roomRates\"]\nCODE_FIELDS\
          \ = [\"code\", \"rateCode\", \"rate_code\", \"planCode\", \"id\"]\nVERIFY_FIELDS = [\"verifyId\", \"verify_id\"\
          , \"planVerifyId\", \"vid\", \"id\"]\nPRICE_FIELDS = [\"dailyPrices\", \"daily_prices\", \"prices\", \"days\", \"\
          items\", \"priceList\"]\n\ndef _extract_verify_ids(rate_obj):\n    for pf in PRICE_FIELDS:\n        daily = rate_obj.get(pf)\
          \ or []\n        if not isinstance(daily, list):\n            continue\n        ids = []\n        for item in daily:\n\
          \            if not isinstance(item, dict):\n                continue\n            for vf in VERIFY_FIELDS:\n  \
          \              v = item.get(vf)\n                if v is not None and str(v) not in (\"0\", \"null\", \"None\",\
          \ \"\"):\n                    try:\n                        ids.append(int(v))\n                        break\n\
          \                    except (ValueError, TypeError):\n                        pass\n        if ids:\n          \
          \  return ids\n    return []\n\ndef _extract_rate_code(rate_obj):\n    for cf in CODE_FIELDS:\n        v = rate_obj.get(cf)\n\
          \        if v and str(v).strip() not in (\"0\", \"null\", \"None\", \"\"):\n            return str(v).strip()\n\
          \    return \"\"\n\ndef _get_rates(room_obj):\n    for rf in RATE_FIELDS:\n        v = room_obj.get(rf)\n      \
          \  if isinstance(v, list) and v:\n            return v\n    return []\n\ndef main(roomsData, roomCode: str, checkInDate:\
