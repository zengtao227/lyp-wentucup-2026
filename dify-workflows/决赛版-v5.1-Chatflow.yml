          name: 客房预订/预订确认/支付（确认预订、正确、好的）
        instructions: 请将用户问题分类到最匹配的类别。注意区分"客房产品体系"（询问房型特点、设施介绍、入住政策、宠物政策、停车、退房时间）和"客房预订/预订确认/支付"（想要预订、查可用日期、查价格、确认预订、支付、取消订单）。凡涉及预订操作的问题（包括今晚订房、明天入住、确认预订、已支付确认），一律归入"客房预订/预订确认/支付（确认预订、正确、好的）"。如果用户在订房上下文中提到宠物、狗、猫、带宠入住，也归入"客房预订/预订确认/支付（确认预订、正确、好的）"；如果只是单独咨询宠物政策且没有订房意图，才归入"客房产品体系"。如果用户消息只包含房型代码001、002、003、004、005、006、007、008、009、010、011、012、013，或只输入1、2、3等选项数字且上一轮正在展示/选择房型，也必须归入"客房预订/预订确认/支付（确认预订、正确、好的）"，不得归入知识库问答。强制规则：如果用户消息只包含或主要表达肯定确认语，例如"确认预订"、"正确"、"好的"、"好"、"对"、"是的"、"没问题"、"可以"、"确认"、"行"、"没错"、"嗯"、"嗯嗯"、"OK"、"ok"，即使你看不到上一轮历史，也必须归入"客房预订/预订确认/支付（确认预订、正确、好的）"，不得归入酒店概况、客房产品体系、餐饮娱乐配套、会议宴会服务、天气查询与周边咨询或开场引导。凡询问天气、气温、下雨、晴天、风力、天气预报，或询问周边景点、景区门票、游玩路线、附近旅游等问题，归入"天气查询与周边咨询"。
